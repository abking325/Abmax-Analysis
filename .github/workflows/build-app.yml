name: Build Web App & Export (Convert to App)

on:
  push:
    branches:
      - '*'
      - '**'
  pull_request:
    branches:
      - '*'
      - '**'
  workflow_dispatch:
    inputs:
      create_release_bundle:
        description: 'Package as standalone downloadable zip app'
        required: false
        default: 'true'
        type: string

jobs:
  build-and-package:
    name: Build & Package Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Types and Code Quality
        run: npm run lint

      - name: Build Production Web App
        run: npm run build
        env:
          VITE_BASE_PATH: './'

      - name: Create Standalone Application Zip
        run: |
          cd dist
          zip -r ../abmax-analysis-app-build.zip .
          cd ..

      - name: Upload Built App Directory (Dist)
        uses: actions/upload-artifact@v4
        with:
          name: abmax-analysis-dist-folder
          path: dist/
          retention-days: 30

      - name: Upload Standalone App Zip Bundle
        uses: actions/upload-artifact@v4
        with:
          name: abmax-analysis-downloadable-app-zip
          path: abmax-analysis-app-build.zip
          retention-days: 30
