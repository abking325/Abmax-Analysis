name: Build ABMAX Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build variant (auto, release, debug, or unsigned-verification)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - release
          - debug
          - unsigned-verification
      allow_local_only:
        description: 'Allow local-only build without cloud sync (skips Supabase key requirement)'
        required: false
        default: false
        type: boolean

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Verify Node.js and npm Environment
        run: |
          echo "Node version: $(node --version)"
          echo "npm version: $(npm --version)"

      - name: Install Dependencies Cleanly
        run: npm ci

      - name: Verify Types and Code Quality
        run: npm run lint

      - name: Run Core Persistence Verification Tests
        run: npm test

      - name: Validate Supabase Configuration
        id: validate_supabase
        run: |
          TARGET_URL="${VITE_SUPABASE_URL}"
          echo "Verifying Supabase Target URL: $TARGET_URL"
          if [ "$TARGET_URL" != "https://fxzurpdymuhlfkdxfgel.supabase.co" ]; then
            echo "::error::VITE_SUPABASE_URL must remain https://fxzurpdymuhlfkdxfgel.supabase.co (found: $TARGET_URL)"
            exit 1
          fi

          if [ -n "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            # Never print or log secret publishable keys
            echo "✅ VITE_SUPABASE_PUBLISHABLE_KEY is present and validated (${#VITE_SUPABASE_PUBLISHABLE_KEY} characters)."
            echo "Note: Presence check confirms environment configuration; live authentication and RLS policies are validated at runtime."
            echo "cloud_enabled=true" >> $GITHUB_OUTPUT
          else
            if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event.inputs.allow_local_only }}" != "true" ]; then
              echo "::error::VITE_SUPABASE_PUBLISHABLE_KEY is required by default for push-to-main and standard builds! Please configure VITE_SUPABASE_PUBLISHABLE_KEY or VITE_SUPABASE_ANON_KEY in your GitHub repository secrets. To intentionally build a local-only offline APK, trigger workflow_dispatch with allow_local_only=true."
              exit 1
            else
              echo "::warning::Local-only build explicitly requested via allow_local_only=true. Building APK with full local offline persistence (cloud sync disabled)."
              echo "cloud_enabled=false" >> $GITHUB_OUTPUT
            fi
          fi
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL || 'https://fxzurpdymuhlfkdxfgel.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_4YIOKlRXAjiSiVlHVU7OaA_-hdCJi-_' }}

      - name: Build Web Application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL || 'https://fxzurpdymuhlfkdxfgel.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_4YIOKlRXAjiSiVlHVU7OaA_-hdCJi-_' }}

      - name: Sync Web Assets to Capacitor Android
        run: npx cap sync android

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 platforms;android-35 build-tools;36.0.0 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Add Android Build Tools to PATH
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -d "$SDK_ROOT/build-tools" ]; then
            BUILD_TOOLS_DIR=$(ls -d "$SDK_ROOT"/build-tools/* 2>/dev/null | sort -V | tail -n 1)
            if [ -n "$BUILD_TOOLS_DIR" ] && [ -d "$BUILD_TOOLS_DIR" ]; then
              echo "$BUILD_TOOLS_DIR" >> "$GITHUB_PATH"
              echo "Added Android build-tools to PATH: $BUILD_TOOLS_DIR"
            fi
          fi

      - name: Grant Execute Permissions for gradlew
        run: chmod +x android/gradlew

      - name: Prepare Signing Keystores
        id: setup_signing
        env:
          INPUT_BUILD_TYPE: ${{ github.event.inputs.build_type || 'auto' }}
          SECRET_DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_BASE64 || vars.DEBUG_KEYSTORE_BASE64 || secrets.DEBUG_KEYSTORE || vars.DEBUG_KEYSTORE || secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          SECRET_DEBUG_STORE_PASSWORD: ${{ secrets.DEBUG_STORE_PASSWORD || vars.DEBUG_STORE_PASSWORD || secrets.DEBUG_KEYSTORE_PASSWORD || 'android' }}
          SECRET_DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS || vars.DEBUG_KEY_ALIAS || 'androiddebugkey' }}
          SECRET_DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD || vars.DEBUG_KEY_PASSWORD || 'android' }}
          SECRET_RELEASE_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 || vars.KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 || vars.RELEASE_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE || vars.KEYSTORE }}
          SECRET_RELEASE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || vars.KEYSTORE_PASSWORD || secrets.RELEASE_KEYSTORE_PASSWORD || secrets.STORE_PASSWORD }}
          SECRET_RELEASE_ALIAS: ${{ secrets.KEY_ALIAS || vars.KEY_ALIAS || secrets.RELEASE_KEY_ALIAS || secrets.ALIAS }}
          SECRET_RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || vars.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD || secrets.KEY_PASS || secrets.KEYSTORE_PASSWORD || vars.KEYSTORE_PASSWORD }}
        run: |
          mkdir -p ~/.android
          HAS_DEBUG_KEY=false
          HAS_RELEASE_KEY=false

          # 1. Inspect and prepare persistent debug keystore if provided
          if [ -n "$SECRET_DEBUG_KEYSTORE" ]; then
            echo "Decoding persistent debug keystore..."
            if ! echo "$SECRET_DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore 2>/dev/null; then
              echo "::error::DEBUG_KEYSTORE_BASE64 contains invalid base64 encoding!"
              exit 1
            fi
            if ! keytool -list -keystore ~/.android/debug.keystore -storepass "$SECRET_DEBUG_STORE_PASSWORD" -alias "$SECRET_DEBUG_KEY_ALIAS" > /dev/null 2>&1; then
              echo "::error::Debug keystore validation failed! ~/.android/debug.keystore is invalid or does not match configured credentials."
              exit 1
            fi
            DEBUG_SHA256=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass "$SECRET_DEBUG_STORE_PASSWORD" -alias "$SECRET_DEBUG_KEY_ALIAS" 2>/dev/null | grep -i "SHA256:" | head -n 1 | awk '{print $2}')
            echo "✅ Persistent debug keystore validated. Certificate SHA-256: ${DEBUG_SHA256}"
            echo "DEBUG_STORE_FILE=${HOME}/.android/debug.keystore" >> $GITHUB_ENV
            echo "DEBUG_STORE_PASSWORD=$SECRET_DEBUG_STORE_PASSWORD" >> $GITHUB_ENV
            echo "DEBUG_KEY_ALIAS=$SECRET_DEBUG_KEY_ALIAS" >> $GITHUB_ENV
            echo "DEBUG_KEY_PASSWORD=$SECRET_DEBUG_KEY_PASSWORD" >> $GITHUB_ENV
            echo "SIGNING_SHA256=${DEBUG_SHA256}" >> $GITHUB_ENV
            HAS_DEBUG_KEY=true
          fi

          # 2. Inspect and prepare persistent release keystore if provided
          if [ -n "$SECRET_RELEASE_KEYSTORE" ]; then
            echo "Decoding release signing keystore..."
            mkdir -p "${GITHUB_WORKSPACE}/android/app"
            if ! echo "$SECRET_RELEASE_KEYSTORE" | base64 -d > "${GITHUB_WORKSPACE}/android/app/release.keystore" 2>/dev/null; then
              echo "::error::KEYSTORE_BASE64 contains invalid base64 encoding!"
              exit 1
            fi
            if ! keytool -list -keystore "${GITHUB_WORKSPACE}/android/app/release.keystore" -storepass "$SECRET_RELEASE_PASSWORD" -alias "$SECRET_RELEASE_ALIAS" > /dev/null 2>&1; then
              echo "::error::Release keystore validation failed! release.keystore does not match the provided password or key alias."
              exit 1
            fi
            RELEASE_SHA256=$(keytool -list -v -keystore "${GITHUB_WORKSPACE}/android/app/release.keystore" -storepass "$SECRET_RELEASE_PASSWORD" -alias "$SECRET_RELEASE_ALIAS" 2>/dev/null | grep -i "SHA256:" | head -n 1 | awk '{print $2}')
            echo "✅ Release keystore validated. Certificate SHA-256: ${RELEASE_SHA256}"
            echo "RELEASE_STORE_FILE=${GITHUB_WORKSPACE}/android/app/release.keystore" >> $GITHUB_ENV
            echo "RELEASE_STORE_PASSWORD=$SECRET_RELEASE_PASSWORD" >> $GITHUB_ENV
            echo "RELEASE_KEY_ALIAS=$SECRET_RELEASE_ALIAS" >> $GITHUB_ENV
            echo "RELEASE_KEY_PASSWORD=$SECRET_RELEASE_KEY_PASSWORD" >> $GITHUB_ENV
            echo "SIGNING_SHA256=${RELEASE_SHA256}" >> $GITHUB_ENV
            HAS_RELEASE_KEY=true
          fi

          # 3. Check for committed permanent release keystore
          if [ "$HAS_RELEASE_KEY" = "false" ] && [ -f "${GITHUB_WORKSPACE}/android/app/abmax-permanent.keystore" ]; then
            echo "Using permanent release keystore: android/app/abmax-permanent.keystore"
            PERMANENT_KEY="${GITHUB_WORKSPACE}/android/app/abmax-permanent.keystore"
            RELEASE_SHA256=$(keytool -list -v -keystore "$PERMANENT_KEY" -storepass "abmaxandroid2026" -alias "abmax" 2>/dev/null | grep -i "SHA256:" | head -n 1 | awk '{print $2}')
            echo "✅ Permanent release keystore validated. Certificate SHA-256: ${RELEASE_SHA256}"
            echo "RELEASE_STORE_FILE=$PERMANENT_KEY" >> $GITHUB_ENV
            echo "RELEASE_STORE_PASSWORD=abmaxandroid2026" >> $GITHUB_ENV
            echo "RELEASE_KEY_ALIAS=abmax" >> $GITHUB_ENV
            echo "RELEASE_KEY_PASSWORD=abmaxandroid2026" >> $GITHUB_ENV
            echo "SIGNING_SHA256=${RELEASE_SHA256}" >> $GITHUB_ENV
            HAS_RELEASE_KEY=true
          fi

          # 4. Determine build target variant
          if [ "$INPUT_BUILD_TYPE" = "unsigned-verification" ]; then
            echo "Mode: Unsigned verification build explicitly requested. (Verifying compilation only; will not be distributed as installable update)."
            echo "target_variant=unsigned-release" >> $GITHUB_OUTPUT
            echo "is_signed=false" >> $GITHUB_OUTPUT
            echo "unsigned_verification=true" >> $GITHUB_OUTPUT
          elif [ "$HAS_RELEASE_KEY" = "true" ] && ([ "$INPUT_BUILD_TYPE" = "release" ] || [ "$INPUT_BUILD_TYPE" = "auto" ] || [ "$HAS_DEBUG_KEY" = "false" ]); then
            echo "Mode: Signed Release APK using persistent release keystore."
            echo "target_variant=release" >> $GITHUB_OUTPUT
            echo "is_signed=true" >> $GITHUB_OUTPUT
            echo "unsigned_verification=false" >> $GITHUB_OUTPUT
          elif [ "$HAS_DEBUG_KEY" = "true" ]; then
            echo "Mode: Signed Debug APK using persistent debug keystore."
            echo "target_variant=debug" >> $GITHUB_OUTPUT
            echo "is_signed=true" >> $GITHUB_OUTPUT
            echo "unsigned_verification=false" >> $GITHUB_OUTPUT
          else
            echo "::error::Persistent signing key missing! Neither DEBUG_KEYSTORE_BASE64 nor KEYSTORE_BASE64 is configured in repository secrets."
            echo "::error::To protect installed user data and guarantee in-place update compatibility, automatic replacement key generation is disabled."
            echo "::error::Please configure DEBUG_KEYSTORE_BASE64 (or KEYSTORE_BASE64) in your GitHub Repository under Settings -> Secrets and variables -> Actions."
            echo "::error::To run an unsigned Gradle compilation check without distributing an APK, run workflow_dispatch with build_type=unsigned-verification."
            exit 1
          fi

      - name: Set Android version
        shell: bash
        run: |
          echo "ANDROID_VERSION_CODE=$((GITHUB_RUN_NUMBER + 10))" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Assemble Android APK with Gradle
        working-directory: ./android
        run: |
          echo "Building with Android versionCode=${ANDROID_VERSION_CODE}, versionName=${ANDROID_VERSION_NAME}"
          TARGET_VARIANT="${{ steps.setup_signing.outputs.target_variant }}"
          if [ "$TARGET_VARIANT" = "release" ] || [ "$TARGET_VARIANT" = "unsigned-release" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Collect and Verify APK Deliverable
        id: collect_apk
        run: |
          mkdir -p apk-output
          FOUND_APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$FOUND_APK" ] || [ ! -f "$FOUND_APK" ]; then
            echo "::error::No APK file generated by Gradle build!"
            exit 1
          fi
          echo "Discovered generated APK: $FOUND_APK"
          cp "$FOUND_APK" apk-output/AbmaxAnalysis.apk
          ls -lh apk-output/

          # 1. Resolve apksigner binary location robustly
          APKSIGNER_BIN=""
          if command -v apksigner >/dev/null 2>&1; then
            APKSIGNER_BIN=$(command -v apksigner)
          else
            SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
            if [ -n "$SDK_ROOT" ] && [ -d "$SDK_ROOT/build-tools" ]; then
              APKSIGNER_BIN=$(find "$SDK_ROOT/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1)
            elif [ -d "/usr/local/lib/android/sdk/build-tools" ]; then
              APKSIGNER_BIN=$(find "/usr/local/lib/android/sdk/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1)
            fi
          fi

          # 2. Check if apksigner tool was found
          if [ -z "$APKSIGNER_BIN" ] || [ ! -x "$APKSIGNER_BIN" ]; then
            echo "::error::Android SDK verification tool 'apksigner' not found! Build-tools may not be configured. Cannot verify APK cryptographic signature."
            echo "Current PATH: $PATH"
            echo "SDK Root: ${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
            exit 1
          fi

          echo "Using apksigner at: $APKSIGNER_BIN"
          echo "Verifying APK Signature and Certificate using apksigner..."

          # 3. Perform cryptographic verification and capture detailed output
          set +e
          "$APKSIGNER_BIN" verify --verbose --print-certs apk-output/AbmaxAnalysis.apk > apksigner_out.txt 2>&1
          VERIFY_EXIT_CODE=$?
          set -e

          cat apksigner_out.txt

          if [ $VERIFY_EXIT_CODE -eq 0 ]; then
            CERT_FINGERPRINT=$(grep -i "SHA-256 digest:" apksigner_out.txt | head -n 1 | awk '{print $3}')
            echo "✅ Verified APK signature successfully. Signer certificate SHA-256: $CERT_FINGERPRINT"
            echo "APK_CERT_FINGERPRINT=$CERT_FINGERPRINT" >> $GITHUB_ENV
            echo "is_apk_signed=true" >> $GITHUB_OUTPUT

            # Compare certificate fingerprint against configured / permanent signing key
            PERMANENT_EXPECTED_SHA256="C9:E6:DF:37:89:CC:1F:25:1C:B0:69:38:60:68:1C:10:E2:4F:C1:08:AC:75:93:D6:CD:9A:B7:CE:36:2F:16:E5"
            EXPECTED_SHA256="${SIGNING_SHA256:-$PERMANENT_EXPECTED_SHA256}"
            if [ -n "$CERT_FINGERPRINT" ]; then
              CLEAN_EXPECTED=$(echo "$EXPECTED_SHA256" | tr '[:lower:]' '[:upper:]' | tr -d ' :')
              CLEAN_ACTUAL=$(echo "$CERT_FINGERPRINT" | tr '[:lower:]' '[:upper:]' | tr -d ' :')
              if [ "$CLEAN_EXPECTED" = "$CLEAN_ACTUAL" ]; then
                echo "✅ Verified certificate fingerprint matches permanent signing key ($CERT_FINGERPRINT)."
              else
                echo "ℹ️ Signer certificate SHA-256: $CERT_FINGERPRINT (Keystore: $EXPECTED_SHA256)"
              fi
            fi
          else
            if [ "${{ steps.setup_signing.outputs.unsigned_verification }}" = "true" ]; then
              echo "::warning::Unsigned verification build confirmed unsigned. Not for device installation."
              echo "is_apk_signed=false" >> $GITHUB_OUTPUT
            else
              echo "::error::APK cryptographic signature verification failed! The APK was compiled but does not have a valid cryptographic signature (apksigner exit code $VERIFY_EXIT_CODE)."
              exit 1
            fi
          fi

      - name: Upload ABMAX Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ABMAX-Android-APK
          path: apk-output/AbmaxAnalysis.apk
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Build Summary
        run: |
          echo "### ABMAX Android APK Build Result 🚀" >> $GITHUB_STEP_SUMMARY
          echo "- **App Name:** AbmaxAnalysis" >> $GITHUB_STEP_SUMMARY
          echo "- **Application ID:** com.abmax.analysis" >> $GITHUB_STEP_SUMMARY
          echo "- **Version Code:** ${ANDROID_VERSION_CODE} (strictly increasing monotonic build number across workflow runs)" >> $GITHUB_STEP_SUMMARY
          echo "- **Version Name:** ${ANDROID_VERSION_NAME}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.setup_signing.outputs.is_signed }}" = "true" ]; then
            echo "- **Signing Status:** ✅ Cryptographically Signed with Persistent Keystore" >> $GITHUB_STEP_SUMMARY
            echo "- **Certificate SHA-256:** \`${APK_CERT_FINGERPRINT:-$SIGNING_SHA256}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Variant:** ${{ steps.setup_signing.outputs.target_variant == 'release' && 'Production Release APK' || 'Persistent Debug APK' }} (Ready for in-place update)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Signing Status:** ⚠️ Unsigned Verification Build Only (Compilation Verified — Not Installable)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **Cloud Build Status:** ${{ steps.validate_supabase.outputs.cloud_enabled == 'true' && '✅ Cloud-Enabled (Supabase connected)' || '⚠️ Local-Only Offline Mode' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact:** Download \`ABMAX-Android-APK\` from this workflow run to retrieve \`AbmaxAnalysis.apk\`." >> $GITHUB_STEP_SUMMARY
