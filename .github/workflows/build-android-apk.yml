name: Build ABMAX Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build variant (debug or release if signed)'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      require_supabase:
        description: 'Require Supabase key (fail build if missing for cloud build)'
        required: false
        default: false
        type: boolean

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Verify Node.js and npm Environment
        run: |
          echo "Node version: $(node --version)"
          echo "npm version: $(npm --version)"

      - name: Install Dependencies Cleanly
        run: npm ci

      - name: Verify Types and Code Quality
        run: npm run lint

      - name: Run Core Persistence Verification Tests
        run: npm test

      - name: Validate Supabase Configuration
        run: |
          TARGET_URL="${VITE_SUPABASE_URL}"
          echo "Verifying Supabase Target URL: $TARGET_URL"
          if [ "$TARGET_URL" != "https://fxzurpdymuhlfkdxfgel.supabase.co" ]; then
            echo "::error::VITE_SUPABASE_URL must remain https://fxzurpdymuhlfkdxfgel.supabase.co (found: $TARGET_URL)"
            exit 1
          fi

          if [ -n "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            # Never print or log secret publishable keys
            echo "✅ VITE_SUPABASE_PUBLISHABLE_KEY is present and validated (${#VITE_SUPABASE_PUBLISHABLE_KEY} characters). Cloud build enabled."
          else
            if [ "${{ github.event.inputs.require_supabase }}" = "true" ] || [ "${REQUIRE_SUPABASE}" = "true" ]; then
              echo "::error::VITE_SUPABASE_PUBLISHABLE_KEY is required for a cloud-enabled build, but no secret or variable was provided! Configure VITE_SUPABASE_PUBLISHABLE_KEY or VITE_SUPABASE_ANON_KEY in your GitHub repository secrets."
              exit 1
            else
              echo "::notice::VITE_SUPABASE_PUBLISHABLE_KEY was not provided. Building APK with full local offline persistence (cloud sync disabled until key is added)."
            fi
          fi
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL || 'https://fxzurpdymuhlfkdxfgel.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY || '' }}

      - name: Build Web Application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL || 'https://fxzurpdymuhlfkdxfgel.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY || '' }}

      - name: Sync Web Assets to Capacitor Android
        run: npx cap sync android

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 platforms;android-35 build-tools;36.0.0 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Grant Execute Permissions for gradlew
        run: chmod +x android/gradlew

      - name: Prepare Signing Keystores
        id: setup_signing
        run: |
          mkdir -p ~/.android
          # Primary persistent debug signing secret name: DEBUG_KEYSTORE_BASE64
          if [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "Restoring persistent debug keystore from DEBUG_KEYSTORE_BASE64..."
            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore
            echo "persistent_debug_key=true" >> $GITHUB_OUTPUT
          elif [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] && [ "${{ github.event.inputs.build_type }}" != "release" ]; then
            echo "Note: DEBUG_KEYSTORE_BASE64 not found, but KEYSTORE_BASE64 is present. Using KEYSTORE_BASE64 as explicit fallback for debug signing..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore
            echo "persistent_debug_key=true" >> $GITHUB_OUTPUT
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 secret is not configured. Gradle will generate a temporary ephemeral keystore unique to this runner VM."
            echo "persistent_debug_key=false" >> $GITHUB_OUTPUT
          fi

          # Inspect and report debug certificate SHA-256 fingerprint if keystore exists
          if [ -f ~/.android/debug.keystore ]; then
            echo "Extracting debug keystore certificate fingerprint..."
            DEBUG_SHA256=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey 2>/dev/null | grep "SHA256:" | head -n 1 | awk '{print $2}')
            echo "DEBUG_SHA256=${DEBUG_SHA256}" >> $GITHUB_ENV
            echo "Debug Keystore Certificate SHA-256: ${DEBUG_SHA256}"
          fi

          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Found private release signing keystore secret (KEYSTORE_BASE64). Decoding..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
            echo "RELEASE_STORE_FILE=release.keystore" >> $GITHUB_ENV
            echo "RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "signed=true" >> $GITHUB_OUTPUT
          else
            echo "No custom release keystore secret provided. Building debug APK."
            echo "signed=false" >> $GITHUB_OUTPUT
          fi

      - name: Assemble Android APK with Gradle
        working-directory: ./android
        run: |
          if [ "${{ steps.setup_signing.outputs.signed }}" = "true" ] && [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Collect and Label APK Deliverable
        run: |
          mkdir -p apk-output
          FOUND_APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$FOUND_APK" ] || [ ! -f "$FOUND_APK" ]; then
            echo "::error::No APK file generated by Gradle build!"
            exit 1
          fi
          echo "Discovered generated APK: $FOUND_APK"
          cp "$FOUND_APK" apk-output/ABMAX-ANALYSIS-personal-testing.apk
          ls -lh apk-output/

      - name: Upload ABMAX Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ABMAX-Android-APK
          path: apk-output/ABMAX-ANALYSIS-personal-testing.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Summary
        run: |
          echo "### ABMAX Android APK Build Succeeded 🚀" >> $GITHUB_STEP_SUMMARY
          echo "- **App Name:** ABMAX ANALYSIS" >> $GITHUB_STEP_SUMMARY
          echo "- **Application ID:** com.abmax.analysis" >> $GITHUB_STEP_SUMMARY
          echo "- **Variant:** Personal Testing Debug APK (Ready for direct sideload installation on Android)" >> $GITHUB_STEP_SUMMARY
          echo "- **Offline Storage:** Bundled locally in APK (no hosting server dependency)" >> $GITHUB_STEP_SUMMARY
          echo "- **Persistent Debug Keystore:** ${{ steps.setup_signing.outputs.persistent_debug_key == 'true' && '✅ Enabled (Persistent across builds)' || '⚠️ Ephemeral (Unique runner key; will require full uninstall/reinstall unless DEBUG_KEYSTORE_BASE64 is set)' }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "$DEBUG_SHA256" ]; then
            echo "- **Signing Certificate SHA-256:** \`$DEBUG_SHA256\`" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **Artifact:** Download \`ABMAX-Android-APK\` from this workflow run, extract the zip, and install \`ABMAX-ANALYSIS-personal-testing.apk\` on your Android device." >> $GITHUB_STEP_SUMMARY
