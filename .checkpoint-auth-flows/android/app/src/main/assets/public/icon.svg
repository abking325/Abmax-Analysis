<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="128" fill="#0B0F17"/>
  <rect x="16" y="16" width="480" height="480" rx="112" stroke="#078354" stroke-width="8" stroke-opacity="0.4"/>
  <!-- Candle 1: Lower wick & body (bullish) -->
  <line x1="160" y1="90" x2="160" y2="420" stroke="#078354" stroke-width="12" stroke-linecap="round"/>
  <rect x="136" y="180" width="48" height="150" rx="10" fill="#078354"/>
  
  <!-- Candle 2: Higher push (bullish expansion) -->
  <line x1="256" y1="60" x2="256" y2="450" stroke="#10B981" stroke-width="14" stroke-linecap="round"/>
  <rect x="228" y="120" width="56" height="230" rx="12" fill="#10B981"/>
  
  <!-- Candle 3: Retest candle -->
  <line x1="352" y1="140" x2="352" y2="390" stroke="#078354" stroke-width="12" stroke-linecap="round"/>
  <rect x="328" y="210" width="48" height="120" rx="10" fill="#078354"/>
  
  <!-- Brand accent text -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">ABMAX</text>
</svg>
