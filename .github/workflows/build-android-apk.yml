name: Build ABMAX Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build variant (debug or release if signed)'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      allow_local_only:
        description: 'Allow local-only build without cloud sync (skips Supabase key requirement)'
        required: false
        default: false
        type: boolean
      allow_ephemeral_signing:
        description: 'Allow ephemeral keystore generation (one-off test only; breaks updates)'
        required: false
        default: false
        type: boolean

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Verify Node.js and npm Environment
        run: |
          echo "Node version: $(node --version)"
          echo "npm version: $(npm --version)"

      - name: Install Dependencies Cleanly
        run: npm ci

      - name: Verify Types and Code Quality
        run: npm run lint

      - name: Run Core Persistence Verification Tests
        run: npm test

      - name: Validate Supabase Configuration
        id: validate_supabase
        run: |
          TARGET_URL="${VITE_SUPABASE_URL}"
          echo "Verifying Supabase Target URL: $TARGET_URL"
          if [ "$TARGET_URL" != "https://fxzurpdymuhlfkdxfgel.supabase.co" ]; then
            echo "::error::VITE_SUPABASE_URL must remain https://fxzurpdymuhlfkdxfgel.supabase.co (found: $TARGET_URL)"
            exit 1
          fi

          if [ -n "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            # Never print or log secret publishable keys
            echo "✅ VITE_SUPABASE_PUBLISHABLE_KEY is present and validated (${#VITE_SUPABASE_PUBLISHABLE_KEY} characters)."
            echo "Note: Presence check confirms environment configuration; live authentication and RLS policies are validated at runtime."
            echo "cloud_enabled=true" >> $GITHUB_OUTPUT
          else
            if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event.inputs.allow_local_only }}" != "true" ]; then
              echo "::error::VITE_SUPABASE_PUBLISHABLE_KEY is required by default for push-to-main and standard builds! Please configure VITE_SUPABASE_PUBLISHABLE_KEY or VITE_SUPABASE_ANON_KEY in your GitHub repository secrets. To intentionally build a local-only offline APK, trigger workflow_dispatch with allow_local_only=true."
              exit 1
            else
              echo "::warning::Local-only build explicitly requested via allow_local_only=true. Building APK with full local offline persistence (cloud sync disabled)."
              echo "cloud_enabled=false" >> $GITHUB_OUTPUT
            fi
          fi
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL || 'https://fxzurpdymuhlfkdxfgel.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY || '' }}

      - name: Build Web Application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL || 'https://fxzurpdymuhlfkdxfgel.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY || '' }}

      - name: Sync Web Assets to Capacitor Android
        run: npx cap sync android

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 platforms;android-35 build-tools;36.0.0 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Grant Execute Permissions for gradlew
        run: chmod +x android/gradlew

      - name: Prepare Signing Keystores
        id: setup_signing
        env:
          SECRET_DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          SECRET_RELEASE_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_RELEASE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_RELEASE_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p ~/.android
          # Handle persistent debug signing via DEBUG_KEYSTORE_BASE64
          if [ -n "$SECRET_DEBUG_KEYSTORE" ]; then
            echo "Decoding persistent debug keystore from DEBUG_KEYSTORE_BASE64 environment variable..."
            if ! echo "$SECRET_DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore 2>/dev/null; then
              echo "::error::DEBUG_KEYSTORE_BASE64 secret contains invalid base64 encoding!"
              exit 1
            fi
            # Validate keystore integrity and standard debug credentials
            if ! keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey > /dev/null 2>&1; then
              echo "::error::Keystore validation failed! ~/.android/debug.keystore is invalid or does not match standard debug credentials (password: android, alias: androiddebugkey)."
              exit 1
            fi
            echo "✅ Persistent debug keystore validated successfully."
            echo "persistent_debug_key=true" >> $GITHUB_OUTPUT
          else
            if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event.inputs.allow_ephemeral_signing }}" != "true" ]; then
              echo "::error::DEBUG_KEYSTORE_BASE64 secret is not configured! Without this persistent key, Gradle would generate a temporary ephemeral key that changes every run and breaks future app updates. Please configure DEBUG_KEYSTORE_BASE64 in your GitHub repository secrets. To proceed with an ephemeral key for a one-off build, trigger workflow_dispatch with allow_ephemeral_signing=true."
              exit 1
            else
              echo "::warning::DEBUG_KEYSTORE_BASE64 not configured. Ephemeral signing explicitly allowed for this manual run."
              echo "persistent_debug_key=false" >> $GITHUB_OUTPUT
            fi
          fi

          # Inspect and report public certificate SHA-256 fingerprint if keystore exists
          if [ -f ~/.android/debug.keystore ]; then
            echo "Extracting debug keystore public certificate fingerprint..."
            DEBUG_SHA256=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey 2>/dev/null | grep -i "SHA256:" | head -n 1 | awk '{print $2}')
            echo "DEBUG_SHA256=${DEBUG_SHA256}" >> $GITHUB_ENV
            echo "Debug Keystore Certificate SHA-256: ${DEBUG_SHA256}"
          fi

          # Handle optional release signing keystore if configured
          if [ -n "$SECRET_RELEASE_KEYSTORE" ]; then
            echo "Found private release signing keystore secret (KEYSTORE_BASE64). Decoding..."
            echo "$SECRET_RELEASE_KEYSTORE" | base64 -d > android/app/release.keystore
            echo "RELEASE_STORE_FILE=release.keystore" >> $GITHUB_ENV
            echo "RELEASE_STORE_PASSWORD=$SECRET_RELEASE_PASSWORD" >> $GITHUB_ENV
            echo "RELEASE_KEY_ALIAS=$SECRET_RELEASE_ALIAS" >> $GITHUB_ENV
            echo "RELEASE_KEY_PASSWORD=$SECRET_RELEASE_KEY_PASSWORD" >> $GITHUB_ENV
            echo "signed=true" >> $GITHUB_OUTPUT
          else
            echo "signed=false" >> $GITHUB_OUTPUT
          fi

      - name: Set Android version
        shell: bash
        run: |
          echo "ANDROID_VERSION_CODE=$((GITHUB_RUN_NUMBER + 10))" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Assemble Android APK with Gradle
        working-directory: ./android
        run: |
          echo "Building with Android versionCode=${ANDROID_VERSION_CODE}, versionName=${ANDROID_VERSION_NAME}"
          if [ "${{ steps.setup_signing.outputs.signed }}" = "true" ] && [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Collect and Label APK Deliverable
        run: |
          mkdir -p apk-output
          FOUND_APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$FOUND_APK" ] || [ ! -f "$FOUND_APK" ]; then
            echo "::error::No APK file generated by Gradle build!"
            exit 1
          fi
          echo "Discovered generated APK: $FOUND_APK"
          cp "$FOUND_APK" apk-output/ABMAX-ANALYSIS-personal-testing.apk
          ls -lh apk-output/

      - name: Upload ABMAX Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ABMAX-Android-APK
          path: apk-output/ABMAX-ANALYSIS-personal-testing.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Summary
        run: |
          echo "### ABMAX Android APK Build Succeeded 🚀" >> $GITHUB_STEP_SUMMARY
          echo "- **App Name:** ABMAX ANALYSIS" >> $GITHUB_STEP_SUMMARY
          echo "- **Application ID:** com.abmax.analysis" >> $GITHUB_STEP_SUMMARY
          echo "- **Version Code:** ${ANDROID_VERSION_CODE} (strictly increasing monotonic build number across workflow runs)" >> $GITHUB_STEP_SUMMARY
          echo "- **Version Name:** ${ANDROID_VERSION_NAME}" >> $GITHUB_STEP_SUMMARY
          echo "- **Variant:** Personal Testing Debug APK (Ready for direct sideload installation on Android)" >> $GITHUB_STEP_SUMMARY
          echo "- **Cloud Build Status:** ${{ steps.validate_supabase.outputs.cloud_enabled == 'true' && '✅ Cloud-Enabled (Supabase connected)' || '⚠️ Local-Only Offline Mode (Explicitly Requested via allow_local_only)' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Persistent Debug Keystore:** ${{ steps.setup_signing.outputs.persistent_debug_key == 'true' && '✅ Enabled (Persistent across builds via DEBUG_KEYSTORE_BASE64)' || '⚠️ Ephemeral (Unique runner key; will require full uninstall/reinstall unless DEBUG_KEYSTORE_BASE64 is set)' }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "$DEBUG_SHA256" ]; then
            echo "- **Signing Certificate SHA-256:** \`$DEBUG_SHA256\`" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **Artifact:** Download \`ABMAX-Android-APK\` from this workflow run, extract the zip, and install \`ABMAX-ANALYSIS-personal-testing.apk\` on your Android device." >> $GITHUB_STEP_SUMMARY
