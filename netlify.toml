# ============================================================================
# Netlify Configuration for ABMAX ANALYSIS
# Framework: Vite + React SPA + Capacitor
# Node Version: 20
# ============================================================================

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--prefer-offline --no-audit"

# Security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# HTML entry point must always revalidate for instant app updates
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Service worker and manifest must always revalidate
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Versioned static JavaScript & CSS assets in /assets/* can be cached immutably
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static icon files
[[headers]]
  for = "/pwa-*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/icon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Redirect rules:
# 1. Do NOT allow missing assets in /assets/* to masquerade as HTML 200
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 404

# 2. SPA client-side navigation fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
